name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: autoreconf
      run: autoreconf -i
    - name: generate jconfig
      run: |
        cd src/jpeg-6b-steg
        cp jconfig.cfg jconfig.h || cp jconfig.doc jconfig.h
        cd ../../
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
